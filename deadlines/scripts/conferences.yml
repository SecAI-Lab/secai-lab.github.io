# Mapping config for deadlines/scripts/update_deadlines.py (machine-read).
#
# One entry per tracked venue.
# Fields:
#   key         canonical title emitted into the data files; must match the
#               frontend TARGETS keys in deadlines/assets/deadline-tracker.js.
#   category    output bucket: system | software | security | ai
#   type        conference | workshop  (used for the `type` field of NEW records)
#   slug        id prefix; record ids are "<slug><2-digit year>", e.g. ccs26
#   full_name   long name for records; enforced on current/future editions
#               (past editions keep their historical values)
#   tier        lab-curated tier (T1/T2/T3/T4/"N/A"). null = unknown -> omitted.
#               NEVER taken from upstream; enforced from this file onto current
#               and future editions, so fixing a tier here self-corrects the data.
#   aliases     titles used to associate records already present in the repo data
#               files with this target (same matching rule as the frontend).
#   official_hosts optional curated host trust anchors used only by the weekly
#               evidence gate. They bootstrap a linkless coverage gap without
#               trusting whatever domain the model proposes.
#   sources     upstream locators:
#                 ccfddl: file path under conference/ in github.com/ccfddl/ccf-deadlines
#                 secdl:  record `name` in sec-deadlines.github.io _data/conferences.yml,
#                         either a plain string or {name, description_contains}
#                         (description_contains disambiguates duplicate names).
#               "manual-only": no reliable deterministic community dataset; the
#               daily script does not fetch it, so the weekly official-source
#               audit discovers and verifies its current edition.
#               The script warns on every run when any target (manual-only or
#               not) has no entry for the upcoming cycle year.
#
# Source priority: when both sources cover the same edition year, the first source
# in source_priority wins (sec-deadlines tracks extensions faster; ccfddl provides
# multi-year backfill). A per-entry `source_priority` key overrides the default.

defaults:
  source_priority: [secdl, ccfddl]

conferences:
  # ---------------- system ----------------
  - key: "OSDI"
    category: system
    type: conference
    slug: osdi
    full_name: "USENIX Symposium on Operating Systems Design and Implementation"
    tier: null
    aliases: ["OSDI"]
    sources:
      ccfddl: "SE/osdi.yml"

  - key: "SOSP"
    category: system
    type: conference
    slug: sosp
    full_name: "ACM Symposium on Operating Systems Principles"
    tier: null
