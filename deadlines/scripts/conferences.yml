      ccfddl: "DS/eurosys.yml"

  - key: "ATC"
    category: system
    type: conference
    slug: atc
    full_name: "ACM SIGOPS Annual Technical Conference"
    tier: T2
    aliases: ["ATC", "USENIX ATC", "SIGOPS ATC"]
    sources:
      # Upstream record was retitled 'USENIX ATC' -> 'SIGOPS ATC' (ACM took ATC
      # over after 2025); we select by file path, never by title.
      ccfddl: "DS/atc.yml"

  - key: "NSDI"
