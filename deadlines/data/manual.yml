# Manual overrides have the highest priority (priority 0 in deadline-tracker.js).
# Add confirmed CFP data here when upstream trackers are wrong or missing;
# every entry MUST cite the official source it was verified against.
#
# NOTE: to override a conference that also exists in the generated files, copy
# its deadline / abstract_deadline / timezone values verbatim — the frontend
# merges rows by deadline proximity, so a matching deadline makes your entry
# land on the same row (your date/place/link then win by priority).

# ccfddl carries WWW 2026's original April schedule; the conference moved.
# Verified 2026-07-30 against https://www2026.thewebconf.org/ :
# "Dubai, United Arab Emirates June 29-July 3, 2026" (April dates are in
# commented-out HTML on that page).
- title: "WWW"
  year: 2026
  abstract_deadline: "2025-09-30 23:59"
  deadline: "2025-10-07 23:59"
  timezone: AoE
  place: "Dubai, UAE"
  date: "June 29 - July 3, 2026"
  start: 2026-06-29
  end: 2026-07-03
  note: "Conference moved from the originally announced April 13-17 dates."

# ccfddl says April 13-16; the official site disagrees.
# Verified 2026-07-30 against https://2026.eurosys.org/ :
# "EuroSys 2026 will be held from 27th (Monday) - 30th (Thursday) April, 2026
# in Edinburgh, UK."
- title: "EuroSys"
  year: 2026
  abstract_deadline:
    - "2025-05-08 23:59"
    - "2025-09-18 23:59"
  deadline:
    - "2025-05-15 23:59"
    - "2025-09-25 23:59"
  timezone: UTC-12
  place: "Edinburgh, UK"
  date: "April 27-30, 2026"
  start: 2026-04-27
  end: 2026-04-30

# sec-deadlines still lists the pre-extension deadline.
# Verified 2026-07-30 against https://eurosec-workshop.github.io/ :
# "Paper Submission Deadline: [struck: February 3, 2026 (AoE)] February 10,
# 2026 (AoE)".
- title: "EuroSec"
  year: 2026
  deadline: "2026-02-10 23:59"
  timezone: AoE
  note: "Deadline extended from February 3 to February 10, 2026."
