# The official SAC 2027 page states the deadline timezone as EST, not AoE as
# upstream assumes. Stored as America/New_York rather than UTC-5: 2 October
# 2026 falls in US Eastern DAYLIGHT time (UTC-4), so a fixed UTC-5 renders the
# deadline an hour LATER than the real instant - the direction that costs a
# submission. Same reason conferences.yml maps Pacific venues to
# America/Los_Angeles rather than PST.
# Verified 2026-08-19 against https://www.sigapp.org/sac/sac2027 :
# "October 2, 2026 (EST) Submission of regular papers and SRC research
# abstracts"
- title: "SAC"
  year: 2027
  deadline: "2026-10-02 23:59"
  timezone: America/New_York
  note: "The CFP writes (EST); October 2 falls in US Eastern Daylight Time, so the zone is stored as America/New_York to resolve the offset correctly."

