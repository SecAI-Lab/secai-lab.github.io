# The frontend FABRICATES an abstract deadline at paper-minus-7-days from any
# note matching /abstract.*1 week before/i (deadline-tracker.js:131), rendering
# it as fact although no data file holds it. Writing the real value in - and
# rewording the note so it no longer arms that regex - replaces a computed
# guess with a cited fact.
# Verified 2026-08-19 against https://sp2026.ieee-security.org/cfpapers.html :
# "First deadline Abstract registration deadline: May 29, 2025 mandatory" and
# "Second deadline Abstract, author, and conflict-of-interest registration
# deadline: November 6, 2025, mandatory"
- title: "S&P"
  year: 2026
  abstract_deadline:
    - "2025-05-29 23:59"
    - "2025-11-06 23:59"
  note: "Abstract registration is mandatory and precedes each paper deadline. Workshops held on May 21, 2026."

# Official site states the conference runs 6-10 July 2026 (five days,
# Mon-Fri), not July 7-9 as currently stored. Deadline, timezone and place
# are confirmed correct on the same page. The page calls the earlier
# milestone 'Registration deadline' and nowhere uses the word 'abstract' for
# the research-paper track (the only 'abstract' occurrence on the page is
# the unrelated poster-track deadline), so abstract_deadline cannot be
# grounded under this gate's label rule and is left unconfirmed rather than
# guessed.
# Verified 2026-10-05 against https://eurosp2026.ieee-security.org/
