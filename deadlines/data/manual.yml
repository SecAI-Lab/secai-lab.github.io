# Manual overrides have the highest priority (priority 0 in deadline-tracker.js).
# Add confirmed CFP data here when upstream trackers are wrong or missing;
# every entry MUST cite the official source it was verified against.
#
# NOTE: the updater (deadlines/scripts/update_deadlines.py) propagates these
# overrides into the generated files on every run, so the generated data and
# this file always agree and an override can move a deadline in EITHER
# direction. Titles must be the canonical key from
# deadlines/scripts/conferences.yml (the run goes red otherwise). An override
# stays active until you delete the entry — the run summary says when upstream
# has caught up and an entry can be removed. A field EXPLICITLY set to null
# deletes that field from the generated record (use it to remove values
# fabricated upstream, e.g. an abstract deadline the official CFP never had).

# ccfddl carries WWW 2026's original April schedule; the conference moved.
# Verified 2026-07-30 against https://www2026.thewebconf.org/ :
# "Dubai, United Arab Emirates June 29-July 3, 2026" (April dates are in
# commented-out HTML on that page).
- title: "WWW"
  year: 2026
  abstract_deadline: "2025-09-30 23:59"
  deadline: "2025-10-07 23:59"
  timezone: AoE
  place: "Dubai, UAE"
  date: "June 29 - July 3, 2026"
  start: 2026-06-29
  end: 2026-07-03
  note: "Conference moved from the originally announced April 13-17 dates."

# ccfddl says April 13-16; the official site disagrees.
# Verified 2026-07-30 against https://2026.eurosys.org/ :
# "EuroSys 2026 will be held from 27th (Monday) - 30th (Thursday) April, 2026
# in Edinburgh, UK."
- title: "EuroSys"
  year: 2026
  abstract_deadline:
    - "2025-05-08 23:59"
    - "2025-09-18 23:59"
  deadline:
    - "2025-05-15 23:59"
    - "2025-09-25 23:59"
  timezone: UTC-12
  place: "Edinburgh, UK"
  date: "April 27-30, 2026"
  start: 2026-04-27
  end: 2026-04-30

