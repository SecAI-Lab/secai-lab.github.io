# Weekly official-source audit of the deadline tracker (Tier 2). Tier 1 is the
# daily deterministic sync in update-deadlines.yml.
#
# Trust boundary: Claude runs only in read-only shard jobs. Its sole output is
# JSON. A separate job starts from a fresh checkout, merges exact-once coverage,
# re-fetches every citation, applies the deterministic risk policy, converges
# and lints the data, and only then may push as github-actions[bot].

name: Audit conference deadlines

on:
  schedule:
    # 23:17 UTC Sunday == 08:17 KST Monday. Off-hour minutes avoid GitHub's
    # documented start-of-hour schedule congestion. Daily sync is at 21:17 UTC.
    - cron: '17 23 * * 0'
  workflow_dispatch:

permissions: {}

# Daily and weekly jobs both derive deadlines/data, so serialize them.
concurrency:
  group: deadline-pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      audit_date: ${{ steps.today.outputs.date }}
      source_sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.shards.outputs.matrix }}
      count: ${{ steps.watchlist.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'pyyaml==6.0.*'

      - name: Record today's date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Record immutable source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline tests
        run: |
          python3 deadlines/scripts/tests/test_update_deadlines.py
          python3 deadlines/scripts/tests/test_audit_lint.py
          python3 deadlines/scripts/tests/test_apply_proposals.py
          python3 deadlines/scripts/tests/test_audit_state.py
          python3 deadlines/scripts/tests/test_audit_batches.py
          python3 deadlines/scripts/tests/test_reconcile_audit_outcomes.py
          python3 deadlines/scripts/tests/test_risk_policy.py
          python3 deadlines/scripts/tests/test_verify_citations.py
          python3 deadlines/scripts/tests/simulate_workflow.py

      # Exit 2 means some upstream fetches degraded, but the existing repository
      # still yields a useful watchlist. Every undocumented exit fails closed.
      - name: Build complete scheduled watchlist
        id: watchlist
        run: |
          set +e
          python3 deadlines/scripts/update_deadlines.py --dry-run --watchlist watchlist.json
          code=$?
          set -e
          case "$code" in
            0|2) ;;
            *)
              echo "::error::watchlist updater failed with unexpected exit code $code"
              exit 1
              ;;
          esac
          count=$(python3 -c "import json; print(len(json.load(open('watchlist.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Watchlist: $count record(s)"

      - name: Detect auditor token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COUNT: ${{ steps.watchlist.outputs.count }}
        run: |
          if [ "$COUNT" != "0" ] && [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is missing; the automated audit cannot run"
            exit 1
          fi

      # Stable shards prevent a long watchlist from starving its tail. The empty
      # fallback keeps a zero-record repository valid without an invalid matrix.
      - name: Split watchlist into bounded shards
        id: shards
        run: |
          python3 deadlines/scripts/audit_batches.py split watchlist.json \
            --output-dir audit-shards --size 10
          if [ ! -f audit-shards/watchlist-001.json ]; then
            cp watchlist.json audit-shards/watchlist-001.json
          fi
          matrix=$(python3 -c 'import json; from pathlib import Path; paths=sorted(Path("audit-shards").glob("watchlist-*.json")); print(json.dumps({"include":[{"shard":p.stem[-3:]} for p in paths]},separators=(",",":")))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # Created before any model runs; this is the authoritative input later
      # downloaded by the only write-capable job.
      - name: Upload immutable audit input
        uses: actions/upload-artifact@v4
        with:
          name: deadline-audit-input-${{ github.run_id }}
          path: |
            watchlist.json
            audit-shards/
          if-no-files-found: error
          retention-days: 30

  audit_shard:
    name: Audit shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository without push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'pyyaml==6.0.*'

      - name: Download immutable audit input
        uses: actions/download-artifact@v4
        with:
          name: deadline-audit-input-${{ github.run_id }}
          path: audit-input

      - name: Select shard and seed pessimistic checkpoint
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          AUDIT_DATE: ${{ needs.prepare.outputs.audit_date }}
        run: |
          cp "audit-input/audit-shards/watchlist-$SHARD.json" watchlist.json
          count=$(python3 -c "import json; print(len(json.load(open('watchlist.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "watchlist_sha=$(sha256sum watchlist.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          python3 deadlines/scripts/apply_proposals.py \
            --proposals audit-proposals.json \
            --seed-from-watchlist watchlist.json \
            --audit-date "$AUDIT_DATE"

      - name: Run Claude auditor
        id: auditor1
        continue-on-error: true
        if: steps.shard.outputs.count != '0'
        timeout-minutes: 24
        # v1.0.210; pin the reviewed source because this step receives a
        # long-lived OAuth token.
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          prompt: |
            Read deadlines/scripts/AUDITOR.md and follow it exactly. This job's
            bounded watchlist shard is watchlist.json. Today's UTC date is
            ${{ needs.prepare.outputs.audit_date }}; use it as audit_date.
            Trust pages fetched this run, never memory.

            Work autonomously; there is nobody to ask. Attempt every one of the
            ${{ steps.shard.outputs.count }} records and replace every seeded
            not_checked entry. A concrete unavailable cause is valid only after
            exhausting the official-source routes described in AUDITOR.md.

            Edit only audit-proposals.json. Checkpoint after every few records.
            Finish with every watchlist identity exactly once and no not_checked.
          # No arbitrary shell or curl: official pages are read with WebFetch and
          # WebSearch. This job also has no repository write credential.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Assert the first auditor touched no protected files
        if: steps.shard.outputs.count != '0'
        env:
          WATCHLIST_SHA: ${{ steps.shard.outputs.watchlist_sha }}
        run: |
          echo "$WATCHLIST_SHA  watchlist.json" | sha256sum --check --strict
          tampered=$(git status --porcelain -- deadlines .github)
          if [ -n "$tampered" ]; then
            echo "::error::auditor modified protected repository files"
            echo "$tampered"
            exit 1
          fi

      # A deterministic re-fetch of only recorded official URLs requeues a
      # model-side fetch failure when the page is actually reachable.
      - name: Reconcile transient fetch outcomes
        continue-on-error: true
        if: steps.shard.outputs.count != '0'
        run: |
          python3 deadlines/scripts/reconcile_audit_outcomes.py \
            --proposals audit-proposals.json --watchlist watchlist.json

      - name: Check first auditor output completeness
        id: attempt1
        run: |
          complete=false
          if python3 deadlines/scripts/audit_batches.py validate \
               watchlist.json audit-proposals.json \
               --audit-date "${{ needs.prepare.outputs.audit_date }}" \
             && python3 deadlines/scripts/apply_proposals.py --validate-only \
               --require-complete --require-some-proposal \
               --watchlist watchlist.json; then
            complete=true
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "::warning::shard output is incomplete or malformed; retrying once"
          fi

      - name: Run Claude auditor completion retry
        id: auditor2
        continue-on-error: true
        if: steps.shard.outputs.count != '0' && steps.attempt1.outputs.complete != 'true'
        timeout-minutes: 24
        # v1.0.210; keep both attempts on the same reviewed implementation.
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          prompt: |
            Read deadlines/scripts/AUDITOR.md and follow it exactly. This is a
            completion retry for watchlist.json. Preserve valid completed
            findings in audit-proposals.json, then inspect every missing or
            not_checked identity. Remove duplicate or unknown identities.
            Today's UTC date is ${{ needs.prepare.outputs.audit_date }}.

            Work autonomously; there is nobody to ask. Edit only
            audit-proposals.json. Finish with every record exactly once and no
            not_checked entries. Trust pages fetched this run, never memory.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Assert the final auditor touched no protected files
        if: steps.shard.outputs.count != '0'
        env:
          WATCHLIST_SHA: ${{ steps.shard.outputs.watchlist_sha }}
        run: |
          echo "$WATCHLIST_SHA  watchlist.json" | sha256sum --check --strict
          tampered=$(git status --porcelain -- deadlines .github)
          if [ -n "$tampered" ]; then
            echo "::error::auditor modified protected repository files"
            echo "$tampered"
            exit 1
          fi

      - name: Validate final shard contract
        run: |
          python3 deadlines/scripts/audit_batches.py validate \
            watchlist.json audit-proposals.json \
            --audit-date "${{ needs.prepare.outputs.audit_date }}"
          python3 deadlines/scripts/apply_proposals.py --validate-only \
            --require-complete --watchlist watchlist.json

      - name: Name shard output
        env:
          SHARD: ${{ matrix.shard }}
        run: cp audit-proposals.json "audit-proposals-$SHARD.json"

      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-audit-output-${{ github.run_id }}-${{ matrix.shard }}
          path: audit-proposals-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  apply:
    needs: [prepare, audit_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      # No model process, environment, git config or hook crosses into this job.
      - name: Check out trusted repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'pyyaml==6.0.*'

      - name: Download immutable watchlist
        uses: actions/download-artifact@v4
        with:
          name: deadline-audit-input-${{ github.run_id }}
          path: audit-input

      - name: Download all completed shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: deadline-audit-output-${{ github.run_id }}-*
          path: shard-output
          merge-multiple: true

      - name: Merge exact-once audit output
        env:
          AUDIT_DATE: ${{ needs.prepare.outputs.audit_date }}
        run: |
          cp audit-input/watchlist.json watchlist.json
          for proposal in shard-output/audit-proposals-*.json; do
            shard=${proposal##*-}
            shard=${shard%.json}
            python3 deadlines/scripts/audit_batches.py validate \
              "audit-input/audit-shards/watchlist-$shard.json" "$proposal" \
              --audit-date "$AUDIT_DATE"
          done
          python3 deadlines/scripts/audit_batches.py merge \
            watchlist.json audit-proposals.json \
            --audit-date "$AUDIT_DATE" \
            shard-output/audit-proposals-*.json
          python3 deadlines/scripts/audit_batches.py validate \
            watchlist.json audit-proposals.json \
            --audit-date "$AUDIT_DATE"
          python3 deadlines/scripts/apply_proposals.py --validate-only \
            --require-complete --watchlist watchlist.json

      - name: Verify official citations independently
        run: |
          set +e
          python3 deadlines/scripts/verify_citations.py \
            --watchlist watchlist.json \
            --out audit-verdicts.json --report-only \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] || [ ! -f audit-verdicts.json ]; then
            echo "::error::citation verifier failed or wrote no verdict file"
            exit 1
          fi

      - name: Apply independently verified fields
        run: |
          set +e
          python3 deadlines/scripts/apply_proposals.py \
            --verdicts audit-verdicts.json \
            --watchlist watchlist.json --require-complete \
            --report audit-summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::applier failed with exit code $code; refusing to publish"
            exit 1
          fi

      - name: Converge and lint
        id: converge
        run: |
          set +e
          python3 deadlines/scripts/update_deadlines.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) ;;
            2)
              echo "degraded=true" >> "$GITHUB_OUTPUT"
              echo "::warning::updater degraded; verified changes will not be pushed this run"
              ;;
            *)
              echo "::error::updater failed with unexpected exit code $code"
              exit 1
              ;;
          esac
          set +e
          out=$(python3 deadlines/scripts/update_deadlines.py --dry-run 2>&1)
          dry_code=$?
          set -e
          echo "$out" | tail -5
          if [ "$dry_code" -ne 0 ] && [ "$dry_code" -ne 2 ]; then
            echo "::error::dry-run convergence check failed with exit code $dry_code"
            exit 1
          fi
          if ! echo "$out" | grep -q "no file changes"; then
            echo "::error::updater did not converge"
            exit 1
          fi
          python3 deadlines/scripts/audit_lint.py

      - name: Commit verified corrections to default branch
        run: |
          if [ "${{ steps.converge.outputs.degraded }}" = "true" ]; then
            echo "::error::updater degraded; retrying automatically on the next schedule"
            exit 1
          fi
          # Even a no-op audit must prove that the trusted pipeline inputs did
          # not change while the model shards were running. Otherwise a stale
          # snapshot could be reported healthy and close an active alert.
          git fetch origin "$DEFAULT_BRANCH"
          latest=$(git rev-parse FETCH_HEAD)
          if ! git diff --quiet "$SOURCE_SHA" "$latest" -- \
               deadlines/ \
               .github/workflows/audit-deadlines.yml \
               .github/workflows/update-deadlines.yml; then
            echo "::error::deadline pipeline inputs changed during the audit; refusing stale publication"
            exit 1
          fi
          if [ -z "$(git status --porcelain -- deadlines/data)" ]; then
            echo "Audit found nothing to correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c deadline-audit-run
          git add -- deadlines/data
          git commit -m "Deadline audit: verified corrections"
          git rebase "$latest"
          set +e
          python3 deadlines/scripts/update_deadlines.py >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::updater was not healthy after rebase; not pushing"
            exit 1
          fi
          set +e
          out=$(python3 deadlines/scripts/update_deadlines.py --dry-run 2>&1)
          dry_code=$?
          set -e
          if [ "$dry_code" -ne 0 ]; then
            echo "::error::post-rebase dry run was not healthy (exit $dry_code); not pushing"
            exit 1
          fi
          if ! echo "$out" | grep -q "no file changes"; then
            echo "::error::data did not converge after rebase; not pushing"
            exit 1
          fi
          python3 deadlines/scripts/audit_lint.py
          if [ -n "$(git status --porcelain -- deadlines/data)" ]; then
            git add -- deadlines/data
            git commit --amend --no-edit
          fi
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Upload deterministic audit telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-audit-telemetry-${{ github.run_id }}
          path: |
            watchlist.json
            audit-proposals.json
            audit-verdicts.json
            audit-summary.md
          if-no-files-found: warn
          retention-days: 30

  lifecycle:
    needs: [prepare, audit_shard, apply]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Close the legacy review-queue issue after a healthy audit
        if: ${{ needs.prepare.result == 'success' && needs.audit_shard.result == 'success' && needs.apply.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --limit 1000 --json number,title \
            --jq '.[] | select(.title == "Deadline audit: proposals held for review") | .number'); do
            gh issue close "$n" --comment "The review queue is retired. This run completed the sharded autonomous audit and retained its telemetry: $RUN_URL"
          done

      - name: File or update an audit failure alert
        if: ${{ needs.prepare.result != 'success' || needs.audit_shard.result != 'success' || needs.apply.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deadline-pipeline \
            --description "Automated deadline pipeline alerts" --color D93F0B --force
          title="Deadline audit failed: $(date -u +%F)"
          body="The autonomous weekly audit did not complete. Results: prepare=${{ needs.prepare.result }}, audit-shard=${{ needs.audit_shard.result }}, apply=${{ needs.apply.result }}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --label deadline-pipeline --limit 1000 \
            --json number,title \
            --jq 'map(select(.title | startswith("Deadline audit failed:"))) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label deadline-pipeline --body "$body"
          fi

      - name: Close stale audit and lifecycle alerts after a healthy audit
        if: ${{ needs.prepare.result == 'success' && needs.audit_shard.result == 'success' && needs.apply.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --label deadline-pipeline --limit 1000 \
            --json number,title \
            --jq '.[] | select((.title | startswith("Deadline audit failed:")) or (.title | startswith("Deadline audit lifecycle failed:"))) | .number'); do
            gh issue close "$n" --comment "Resolved by a complete autonomous audit: $RUN_URL"
          done

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/audit-deadlines.yml/enable"

      - name: File an alert if audit lifecycle maintenance failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deadline-pipeline \
            --description "Automated deadline pipeline alerts" --color D93F0B --force
          title="Deadline audit lifecycle failed: $(date -u +%F)"
          body="The audit completed its worker jobs, but lifecycle maintenance (issue handling or schedule keepalive) failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --label deadline-pipeline --limit 1000 \
            --json number,title \
            --jq 'map(select(.title | startswith("Deadline audit lifecycle failed:"))) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label deadline-pipeline --body "$body"
          fi
