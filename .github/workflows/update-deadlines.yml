# Auto-updates deadlines/data/conferences/<year>/<category>.yml from upstream
# community deadline datasets. Runs daily and on manual dispatch.
#
# Note: pushes made with the default GITHUB_TOKEN do NOT trigger other GitHub
# Actions workflows (so this job can never start a self-trigger loop), but
# GitHub Pages classic branch builds still deploy on bot pushes.

name: Update conference deadlines

on:
  schedule:
    # 21:00 UTC == 06:00 KST, daily
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # failure alerts are filed as issues (label: deadline-pipeline)
  actions: write  # keepalive: re-enabling the workflow resets GitHub's 60-day auto-disable timer

# Shared with audit-deadlines.yml: both write deadlines/data, so they must
# never run at once regardless of what the schedules say.
concurrency:
  group: deadline-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'pyyaml==6.0.*'

      # Updater exit codes: 0 = healthy, 2 = degraded (files were still written
      # where safe, but something needs human attention), 1 = fatal (nothing
      # written). 0 and 2 both proceed to the commit step so good data is never
      # held hostage by a partial failure; 2 then fails the job afterwards so
      # the run shows red and the alert issue gets filed. The full report is
      # mirrored to the job summary either way.
      - name: Run deadline updater
        id: updater
        run: |
          set +e
          set -o pipefail
          python3 deadlines/scripts/update_deadlines.py | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "Updater reported degraded health; committing what was written, then failing the job."
            exit 0
          fi
          exit "$code"

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain -- deadlines/data/conferences)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- deadlines/data/conferences
            git commit -m "Auto-update conference deadlines"
            # A human may have pushed to master while this job ran; rebase our
            # single data-only commit instead of failing the push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Fail the run if the updater reported degraded health
        if: steps.updater.outputs.exit_code == '2'
        run: |
          echo "Updater exit code 2 (degraded) - see the [!] lines in the job summary."
          exit 1

      # A red run alone is easy to miss; file (or bump) an issue so somebody
      # actually sees it.
      - name: File an alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled conference-deadline update failed or reported degraded health. See the run log and job summary: $run_url"
          existing=$(gh issue list --state open --label deadline-pipeline --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create deadline-pipeline --description "Automated deadline pipeline alerts" --color D93F0B --force
            gh issue create --title "Deadline auto-update needs attention" --label deadline-pipeline --body "$body"
          fi

      # Nothing ever closed these, so an alert from a failed run stayed open
      # forever and the next healthy run said nothing about it. An alert that
      # outlives its cause trains people to ignore alerts.
      - name: Close stale pipeline alerts on a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --label deadline-pipeline --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Resolved by a healthy sync run: $RUN_URL"
          done

      # GitHub auto-disables cron workflows after 60 days without repo
      # activity; re-enabling on every run resets that timer.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-deadlines.yml/enable" || true
